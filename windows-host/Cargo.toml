[package]
name = "remotedesk-host"
version = "0.3.1"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
screenshots = "0.8.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }
webrtc = "=0.11.0"
