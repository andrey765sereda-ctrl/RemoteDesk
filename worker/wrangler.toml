name = "remotedesk-api"
main = "src/index.ts"
compatibility_date = "2026-10-19"
workers_dev = true

[vars]
APP_ENV = "production"
# After GitHub Pages is published, set this to the exact origin only, e.g.
# PAGES_ORIGIN = "https://YOUR_GITHUB_USERNAME.github.io"

[[durable_objects.bindings]]
name = "PAIRING_DIRECTORY"
class_name = "PairingDirectory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PairingDirectory"]
